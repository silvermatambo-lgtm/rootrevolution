name: One-time Root Revolution order email smoke test
on:
  push:
    paths:
      - '.github/workflows/root-revolution-order-smoke-test.yml'
jobs:
  email-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit a clearly marked test order to FormSubmit
        run: |
          node <<'NODE'
          (async () => {
            const destination = 'denise.cochrane78@gmail.com';
            const payload = {
              _subject: 'TEST ONLY - Root Revolution Website Order (please ignore)',
              _cc: 'info@rootrevolution.co.za',
              _template: 'table',
              _captcha: 'false',
              name: 'ROOT REVOLUTION AUTOMATED TEST - NOT A CUSTOMER',
              phone: '0000000000',
              email: 'no-reply@example.com',
              address: 'TEST ONLY - NO DELIVERY',
              suburb: 'TEST',
              city: 'TEST',
              province: 'TEST',
              postal_code: '0000',
              order_items: 'AUTOMATED FORM TEST ONLY - NO ITEMS',
              order_total: 'R0',
              notes: 'Automated integration test requested by site owner. No customer order.'
            };
            const response = await fetch('https://formsubmit.co/ajax/' + destination, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Origin': 'https://rootrevolution.co.za',
                'Referer': 'https://rootrevolution.co.za/checkout'
              },
              body: JSON.stringify(payload)
            });
            const body = await response.text();
            console.log('FormSubmit response HTTP:', response.status);
            console.log('FormSubmit response body:', body.slice(0, 1200));
            const data = (() => { try { return JSON.parse(body); } catch { return null; } })();
            if (!response.ok || (data?.success !== 'true' && data?.success !== true)) {
              console.error('Email not confirmed as accepted. Form recipient may require activation.');
              process.exitCode = 1;
            } else {
              console.log('Service accepted the test. Inbox receipt still needs human verification.');
            }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE
